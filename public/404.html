<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ООО «БИРОНИКС» — Перенаправление...</title>
    <script type="text/javascript">
      // SPA redirect script for GitHub Pages
      // Handles subfolder repositories like https://<user>.github.io/<repo>/
      var pathSegmentsToKeep = 0;
      var segments = window.location.pathname.split('/').filter(Boolean);
      // If deployed in a project subfolder on github.io
      if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
        pathSegmentsToKeep = 1;
      }

      var l = window.location;
      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?p=/' +
        routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
